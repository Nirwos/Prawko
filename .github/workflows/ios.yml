name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "www/**"
      - "capacitor.config.ts"
      - "package.json"
      - "app-version.json"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx cap sync ios

      - name: Wersja
        id: ver
        run: |
          echo "name=$(node -p "require(./app-version.json).versionName")" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require(./app-version.json).versionCode")" >> "$GITHUB_OUTPUT"

      - name: Build (bez podpisu)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.ver.outputs.name }} \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.code }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E "error:|BUILD FAILED|xcodebuild: error" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            tail -15 build.log | while IFS= read -r l; do echo "::warning::$l"; done
            exit $rc
          fi

      - name: Pakowanie .ipa
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/Prawko-${{ steps.ver.outputs.name }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Prawko-${{ steps.ver.outputs.name }}-ipa
          path: Prawko-*.ipa
          retention-days: 30
