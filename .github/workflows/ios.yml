name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "www/**"
      - "capacitor.config.ts"
      - "package.json"
      - "app-version.json"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx cap sync ios

      - name: Wersja
        id: ver
        run: |
          echo "name=$(node -p "require(./app-version.json).versionName")" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require(./app-version.json).versionCode")" >> "$GITHUB_OUTPUT"

      - name: Build (bez podpisu)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.ver.outputs.name }} \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.code }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Pakowanie .ipa
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/Prawko-${{ steps.ver.outputs.name }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Prawko-${{ steps.ver.outputs.name }}-ipa
          path: Prawko-*.ipa
          retention-days: 30
